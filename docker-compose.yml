# =============================================================
# docker-compose.yml — Local Development Environment
# SOC Alert Enrichment Platform (example stack)
# Generic case management platform + backing store.
# The service below uses an open-source IR platform as ONE
# example of a compatible case management API.
# Replace the image with any platform that exposes a compatible API.
# =============================================================

services:

  # -----------------------------------------------------------
  # Cassandra — backing store for the example case platform
  # -----------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    container_name: soc_cassandra
    restart: unless-stopped
    environment:
      - CASSANDRA_CLUSTER_NAME=soc-cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=200M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - soc_network

  # -----------------------------------------------------------
  # Example case management platform — one compatible implementation
  # (e.g., TheHive CE via strangebee/thehive). Swap the image
  # for any platform that implements the same REST API.
  # -----------------------------------------------------------
  case-platform:
    image: strangebee/thehive:5.2.7-1
    container_name: soc_case_platform
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      - JVM_OPTS=-Xms512m -Xmx1g
      - TH_SECRET=${CASE_PLATFORM_SECRET:-change-me-for-local-development}
      - TH_NO_CONFIG_SECRET=false
    command:
      - --cql-hostnames
      - cassandra
      - --cql-username
      - cassandra
      - --cql-password
      - cassandra
    volumes:
      - case_platform_data:/opt/thp/thehive/files
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - soc_network

# -----------------------------------------------------------
# Volumes
# -----------------------------------------------------------
volumes:
  cassandra_data:
    driver: local
  case_platform_data:
    driver: local

# -----------------------------------------------------------
# Network
# -----------------------------------------------------------
networks:
  soc_network:
    driver: bridge
